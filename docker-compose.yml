services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oob
      POSTGRES_USER: oob
      POSTGRES_PASSWORD: oob
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oob -d oob"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://oob:oob@db:5432/oob
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"
